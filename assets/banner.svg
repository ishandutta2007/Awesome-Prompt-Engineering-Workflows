<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background: #090d16; border-radius: 12px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="glowPurple" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="75%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="85%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradient for Text & Borders -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>

    <style>
      @keyframes dashMove {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseAura {
        0%, 100% { transform: scale(1); opacity: 0.25; }
        50% { transform: scale(1.15); opacity: 0.45; }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes nodePulse {
        0%, 100% { r: 5; opacity: 0.9; }
        50% { r: 8; opacity: 1; }
      }
      .anim-dash {
        stroke-dasharray: 12, 10;
        animation: dashMove 35s linear infinite;
      }
      .anim-dash-fast {
        stroke-dasharray: 8, 8;
        animation: dashMove 20s linear infinite reverse;
      }
      .anim-pulse {
        transform-origin: center;
        animation: pulseAura 7s ease-in-out infinite;
      }
      .anim-node {
        animation: nodePulse 3s ease-in-out infinite;
      }
      .anim-float {
        animation: floatParticle 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 1. Background Rect -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- 2. Ambient Grid Background -->
  <rect width="1200" height="360" fill="url(#grid)" opacity="0.65" />

  <!-- 3. Dynamic Animated Lighting Elements (Background Layer) -->
  <g class="anim-pulse">
    <circle cx="280" cy="110" r="220" fill="url(#glowPurple)" />
    <circle cx="950" cy="240" r="240" fill="url(#glowCyan)" />
    <circle cx="820" cy="80" r="160" fill="url(#glowEmerald)" />
  </g>

  <!-- 4. Dynamic Animated Workflow Flow Lines (Midground Layer) -->
  <g opacity="0.6">
    <!-- Curved Workflow Connection 1 -->
    <path d="M -50,280 C 200,280 250,70 500,70 S 750,300 1000,290 C 1100,285 1180,180 1250,180" 
          fill="none" stroke="url(#lineGrad1)" stroke-width="2.5" class="anim-dash" />
    
    <!-- Curved Workflow Connection 2 -->
    <path d="M -50,90 C 180,90 320,290 600,290 S 880,90 1050,100 C 1150,105 1200,200 1250,200" 
          fill="none" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.8" class="anim-dash-fast" />

    <!-- Workflow Node Markers (Visual Prompt Pipeline: Spec -> Template -> Eval -> Deploy) -->
    <g class="anim-float">
      <!-- Node 1: Spec -->
      <circle cx="210" cy="180" r="5" fill="#8b5cf6" filter="url(#neonGlow)" class="anim-node" />
      <circle cx="210" cy="180" r="14" fill="none" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5" />
      
      <!-- Node 2: Optimize -->
      <circle cx="480" cy="72" r="5" fill="#38bdf8" filter="url(#neonGlow)" class="anim-node" style="animation-delay: 1s;" />
      <circle cx="480" cy="72" r="12" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />

      <!-- Node 3: Eval -->
      <circle cx="780" cy="285" r="5" fill="#10b981" filter="url(#neonGlow)" class="anim-node" style="animation-delay: 2s;" />
      <circle cx="780" cy="285" r="12" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />

      <!-- Node 4: Production -->
      <circle cx="1020" cy="190" r="5" fill="#f59e0b" filter="url(#neonGlow)" class="anim-node" style="animation-delay: 1.5s;" />
      <circle cx="1020" cy="190" r="12" fill="none" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" />
    </g>
  </g>

  <!-- 5. Foreground Content Layer (Text and Badges - Kept In Foreground) -->
  <g id="foreground" filter="url(#shadow)">
    <!-- Top Pill / Super-header -->
    <g transform="translate(60, 48)">
      <rect width="280" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="url(#badgeBorder)" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981" filter="url(#neonGlow)" />
      <text x="30" y="20" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.8">CURATED ECOSYSTEM • 2026</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="132" fill="url(#titleGrad)" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Prompt Engineering Workflows
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="60" y="172" fill="#cbd5e1" font-size="17" font-weight="400" letter-spacing="0.1">
      Top SaaS Platforms &amp; Open-Source Toolkits for Versioning, Evaluation-Driven Iteration &amp; LLMOps
    </text>

    <!-- Functional Feature Badges / Highlights -->
    <g transform="translate(60, 218)">
      <!-- Badge 1: Pattern Libraries -->
      <g transform="translate(0, 0)">
        <rect width="186" height="42" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="16" y="26" font-size="15">📚</text>
        <text x="44" y="26" fill="#f8fafc" font-size="13" font-weight="600">Pattern Libraries</text>
      </g>

      <!-- Badge 2: Git-Based Versioning -->
      <g transform="translate(202, 0)">
        <rect width="210" height="42" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="16" y="26" font-size="15">🔄</text>
        <text x="44" y="26" fill="#f8fafc" font-size="13" font-weight="600">Git &amp; Hash Versioning</text>
      </g>

      <!-- Badge 3: Automated Evaluation -->
      <g transform="translate(428, 0)">
        <rect width="194" height="42" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="16" y="26" font-size="15">🧪</text>
        <text x="44" y="26" fill="#f8fafc" font-size="13" font-weight="600">Matrix Evaluation</text>
      </g>

      <!-- Badge 4: Production LLMOps -->
      <g transform="translate(638, 0)">
        <rect width="188" height="42" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="16" y="26" font-size="15">🚀</text>
        <text x="44" y="26" fill="#f8fafc" font-size="13" font-weight="600">Production LLMOps</text>
      </g>

      <!-- Badge 5: Agent Optimization -->
      <g transform="translate(842, 0)">
        <rect width="206" height="42" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="16" y="26" font-size="15">⚡</text>
        <text x="44" y="26" fill="#f8fafc" font-size="13" font-weight="600">Agent Optimization</text>
      </g>
    </g>

    <!-- Bottom Footer Meta Info -->
    <g transform="translate(60, 305)">
      <text x="0" y="0" fill="#64748b" font-size="13" font-weight="500">
        Engineered for AI Developers, Prompt Engineers, and Enterprise LLMOps Teams
      </text>
    </g>
  </g>
</svg>
